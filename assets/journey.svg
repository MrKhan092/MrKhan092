<svg viewBox="0 0 1000 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Education — Mohammad Kaif">
  <style>
    :root { --bone:#1a1a1a; --muted:#555555; --dim:#737373; --rule:#bdbdbd; --accent:#000000; --ghost:#d6d6d6; --ink:#000000; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <line x1="120" y1="16" x2="120" y2="300" stroke="var(--rule)" stroke-width="1" opacity=".6"/>
  <g class="rise a1">
    <text class="mono" x="48" y="42" font-size="12" fill="var(--accent)" letter-spacing="2">NOW</text>
    <text class="mono" x="136" y="42" font-size="14" fill="var(--bone)">2023 – 2027  { ongoing }</text>
    <text class="mono" x="136" y="68" font-size="15" fill="var(--bone)">Chandigarh University · B.E. Computer Science · CGPA 8.95</text>
    <text class="mono" x="136" y="90" font-size="13" fill="var(--muted)">Data Structures &amp; Algorithms · OS · DBMS · Computer Networks · System Design</text>
    <text class="mono" x="136" y="110" font-size="13" fill="var(--muted)">Gharuan, Punjab</text>
  </g>
  <g class="rise a2">
    <text class="mono" x="48" y="144" font-size="12" fill="var(--accent)" letter-spacing="2">2022</text>
    <text class="mono" x="136" y="144" font-size="14" fill="var(--bone)">2021 – 2022</text>
    <text class="mono" x="136" y="170" font-size="15" fill="var(--bone)">Metropolitan School · Intermediate (ISC Board)</text>
    <text class="mono" x="136" y="192" font-size="13" fill="var(--muted)">Gorakhpur, Uttar Pradesh</text>
  </g>
  <g class="rise a3">
    <text class="mono" x="48" y="232" font-size="12" fill="var(--accent)" letter-spacing="2">2020</text>
    <text class="mono" x="136" y="232" font-size="14" fill="var(--bone)">2019 – 2020</text>
    <text class="mono" x="136" y="258" font-size="15" fill="var(--bone)">Metropolitan School · Matriculation (ICSE Board)</text>
    <text class="mono" x="136" y="280" font-size="13" fill="var(--muted)">Gorakhpur, Uttar Pradesh</text>
  </g>
</svg>
