<svg viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering journey — DevOps, generative AI, full-stack engineering, and computer science">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ghost: #000000; }
  </style>

  <line x1="120" y1="10" x2="120" y2="348" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42" font-size="12" fill="var(--accent)" letter-spacing="2">2026 →</text>
    <text class="mono" x="136" y="42" font-size="14" fill="var(--bone)">2026 – PRESENT</text>
    <text class="mono" x="136" y="68" font-size="15" fill="var(--muted)">DevOps &amp; Cloud Engineering</text>
    <text class="mono" x="136" y="90" font-size="13" fill="var(--muted)">Docker · Kubernetes · Helm · Jenkins · GitHub Actions · Argo CD · Terraform · AWS · Prometheus · Grafana</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="132" font-size="12" fill="var(--accent)" letter-spacing="2">2026 →</text>
    <text class="mono" x="136" y="132" font-size="14" fill="var(--bone)">2026 – PRESENT</text>
    <text class="mono" x="136" y="158" font-size="15" fill="var(--muted)">Generative AI &amp; Agentic AI</text>
    <text class="mono" x="136" y="180" font-size="13" fill="var(--muted)">Python · LangChain · LangGraph · RAG · Vector Databases · LLMs · AI Agents</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="222" font-size="12" fill="var(--accent)" letter-spacing="2">2025 →</text>
    <text class="mono" x="136" y="222" font-size="14" fill="var(--bone)">2025 – PRESENT</text>
    <text class="mono" x="136" y="248" font-size="15" fill="var(--muted)">Full-Stack Engineering</text>
    <text class="mono" x="136" y="270" font-size="13" fill="var(--muted)">React · TypeScript · Node.js · Express · PostgreSQL · MongoDB · Redis</text>
  </g>

  <g class="rise a4">
    <text class="mono" x="48" y="312" font-size="12" fill="var(--accent)" letter-spacing="2">2023 →</text>
    <text class="mono" x="136" y="312" font-size="14" fill="var(--bone)">2023 – 2027</text>
    <text class="mono" x="136" y="338" font-size="15" fill="var(--muted)">B.E. Computer Science · Chandigarh University</text>
  </g>

</svg>
