
name: Update telemetry stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch stats and regenerate SVG
        env:
          GITHUB_USERNAME: MrKhan092
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stats.mjs

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/telemetry.svg \
                  assets/dark/telemetry.svg \
                  assets/github-stats.svg \
                  assets/dark/github-stats.svg \
                  assets/contribution-graph.svg \
                  assets/dark/contribution-graph.svg \
                  assets/stats.json

          git diff --cached --quiet || git commit -m "chore: refresh telemetry stats"

          git push
