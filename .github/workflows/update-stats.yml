
name: Update telemetry stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Prevent overlapping runs from pushing conflicting commits.
concurrency:
  group: telemetry-stats-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Commit updated files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/telemetry.svg \
                  assets/dark/telemetry.svg \
                  assets/github-stats.svg \
                  assets/dark/github-stats.svg \
                  assets/contribution-graph.svg \
                  assets/dark/contribution-graph.svg \
                  assets/stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh telemetry stats"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
