
name: Update telemetry stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: telemetry-stats-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch stats and regenerate SVG
        env:
          GITHUB_USERNAME: MrKhan092
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stats.mjs

      - name: Commit updated files
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/telemetry.svg \
                  assets/dark/telemetry.svg \
                  assets/github-stats.svg \
                  assets/dark/github-stats.svg \
                  assets/contribution-graph.svg \
                  assets/dark/contribution-graph.svg \
                  assets/stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh telemetry stats"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
